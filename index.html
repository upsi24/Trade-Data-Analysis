<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Cashier System</title>
    <style>
        /* Mobile-friendly styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f4f4f9;
            color: #333;
        }
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }
        .header h2 {
            margin: 0;
            font-size: 24px;
        }
        .clock-container {
            margin-top: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px 5px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            font-size: 13px; /* Smaller font to fit long names */
            font-weight: bold;
            cursor: pointer;
            width: calc(50% - 14px); /* Fits two buttons per row */
            line-height: 1.3;
            vertical-align: top;
        }
        button:active {
            background-color: #2980b9;
        }
        .time-btn {
            width: auto;
            padding: 5px 10px;
            font-size: 14px;
            background-color: #e67e22;
        }
        .section {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .cart-list {
            list-style-type: none;
            padding: 0;
            margin: 0 0 10px 0;
        }
        .cart-list li {
            padding: 5px 0;
            border-bottom: 1px solid #ddd;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-top: 5px;
            margin-bottom: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .checkout-btn {
            width: 100%;
            background-color: #27ae60;
            font-weight: bold;
            font-size: 18px;
            padding: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        .danger-btn {
            background-color: #e74c3c;
            width: 100%;
            margin-top: 15px;
            padding: 15px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <h2>Total Sales: RM <span id="total-sales">0.00</span></h2>
        <div class="clock-container">
            <span id="clock">00:00:00</span>
            <button class="time-btn" onclick="toggleTimeFormat()">12/24 Hr</button>
        </div>
    </div>

    <!-- Stock / Items Section -->
    <div class="section">
        <h3>Select Items</h3>
        
        <!-- Snacks -->
        <button onclick="addItem('LAYS', 7.00)">LAYS<br>(RM7.00)</button>
        <button onclick="addItem('TWISTIES', 5.00)">TWISTIES<br>(RM5.00)</button>
        <button onclick="addItem('CHEEZEL', 5.00)">CHEEZEL<br>(RM5.00)</button>
        <button onclick="addItem('SMALL RTE (CARAMEL)', 7.00)">SMALL RTE (CARAMEL)<br>(RM7.00)</button>
        <button onclick="addItem('SMALL RTE (CHOCOLATE)', 7.00)">SMALL RTE (CHOCO)<br>(RM7.00)</button>
        <button onclick="addItem('SMALL RTE (BBQ)', 7.00)">SMALL RTE (BBQ)<br>(RM7.00)</button>
        <button onclick="addItem('SMALL RTE (NASI LEMAK)', 7.00)">SMALL RTE (N.LEMAK)<br>(RM7.00)</button>
        <button onclick="addItem('SALMON SKIN SALTED EGG', 16.00)">SALMON SKIN S.EGG<br>(RM16.00)</button>
        <button onclick="addItem('SALMON SKIN SPICY', 16.00)">SALMON SKIN SPICY<br>(RM16.00)</button>
        <button onclick="addItem('NACHOS', 16.00)">NACHOS<br>(RM16.00)</button>
        <button onclick="addItem('8oz PAPER CUP', 5.30)">8oz PAPER CUP<br>(RM5.30)</button>

        <!-- Beverages -->
        <button onclick="addItem('SPRITZER MINERAL', 4.00)">SPRITZER MINERAL<br>(RM4.00)</button>
        <button onclick="addItem('A&W', 5.00)">A&W<br>(RM5.00)</button>
        <button onclick="addItem('MONSTER ENERGY ORIGINAL', 8.00)">MONSTER ORIGINAL<br>(RM8.00)</button>
        <button onclick="addItem('MONSTER ENERGY ULTRA ZERO', 8.00)">MONSTER ULTRA ZERO<br>(RM8.00)</button>
        <button onclick="addItem('SPRITZER SO TINGE', 5.00)">SPRITZER SO TINGE<br>(RM5.00)</button>
        <button onclick="addItem('AYATAKA', 5.00)">AYATAKA<br>(RM5.00)</button>
        <button onclick="addItem('MINUTE MAID PLUS+', 7.00)">MINUTE MAID PLUS+<br>(RM7.00)</button>
        <button onclick="addItem('V-SOY', 2.20)">V-SOY<br>(RM2.20)</button>
        <button onclick="addItem('SUNQUICK RTD', 2.20)">SUNQUICK RTD<br>(RM2.20)</button>
        <button onclick="addItem('ZUS EXPRESSO CAN', 5.00)">ZUS EXPRESSO CAN<br>(RM5.00)</button>
        <button onclick="addItem('ZUS SPECIALTY LATTE BOTTLE', 5.00)">ZUS LATTE BOTTLE<br>(RM5.00)</button>
    </div>

    <!-- Current Order Section -->
    <div class="section">
        <h3>Current Order</h3>
        <ul class="cart-list" id="cart-list"></ul>
        <p style="font-size: 18px;"><strong>Total: RM <span id="cart-total">0.00</span></strong></p>
        
        <label for="cash-given">Customer Paid (RM):</label>
        <input type="number" id="cash-given" placeholder="Enter amount received" step="0.10">
        
        <button class="checkout-btn" onclick="processPayment()">Calculate Balance</button>
        
        <h3 style="color: #c0392b;">Balance to return: RM <span id="balance-due">0.00</span></h3>
    </div>

    <!-- History Section -->
    <div class="section">
        <h3>Transaction History</h3>
        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Items</th>
                    <th>Paid</th>
                    <th>Bal</th>
                </tr>
            </thead>
            <tbody id="history-body">
                <!-- Data will be inserted here automatically -->
            </tbody>
        </table>
        <button class="danger-btn" onclick="clearHistory()">Clear All Data</button>
    </div>

    <script>
        let cart = [];
        let cartTotal = 0;
        let totalSales = 0;
        let transactions = [];
        let is24Hour = false;

        window.onload = function() {
            let savedSales = localStorage.getItem("totalSales");
            if (savedSales !== null) {
                totalSales = parseFloat(savedSales);
            }

            let savedHistory = localStorage.getItem("transactions");
            if (savedHistory !== null) {
                transactions = JSON.parse(savedHistory);
            }

            updateUI();
            updateClock();
            setInterval(updateClock, 1000); 
        };

        function toggleTimeFormat() {
            is24Hour = !is24Hour;
            updateClock();
        }

        function updateClock() {
            let now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let ampm = "";

            if (is24Hour === false) {
                if (hours >= 12) {
                    ampm = " PM";
                } else {
                    ampm = " AM";
                }
                hours = hours % 12;
                if (hours === 0) {
                    hours = 12;
                }
            }

            if (minutes < 10) minutes = "0" + minutes;
            if (seconds < 10) seconds = "0" + seconds;
            if (is24Hour === true && hours < 10) hours = "0" + hours;

            document.getElementById("clock").innerText = hours + ":" + minutes + ":" + seconds + ampm;
        }

        function addItem(name, price) {
            cart.push({ name: name, price: price });
            cartTotal = cartTotal + price;
            updateCartUI();
        }

        function updateCartUI() {
            let list = document.getElementById("cart-list");
            list.innerHTML = ""; 
            
            for (let i = 0; i < cart.length; i++) {
                let li = document.createElement("li");
                li.innerText = cart[i].name + " - RM" + cart[i].price.toFixed(2);
                list.appendChild(li);
            }
            document.getElementById("cart-total").innerText = cartTotal.toFixed(2);
        }

        function processPayment() {
            if (cart.length === 0) {
                alert("Please select items first!");
                return;
            }

            let cashInput = document.getElementById("cash-given").value;
            let cashGiven = parseFloat(cashInput);

            if (isNaN(cashGiven) || cashGiven < cartTotal) {
                alert("Please enter enough money to cover the total.");
                return;
            }

            let balance = cashGiven - cartTotal;
            document.getElementById("balance-due").innerText = balance.toFixed(2);

            let timeString = document.getElementById("clock").innerText;
            let itemNames = "";
            
            for (let i = 0; i < cart.length; i++) {
                itemNames = itemNames + cart[i].name + (i < cart.length - 1 ? ", " : "");
            }

            let newTransaction = {
                time: timeString,
                items: itemNames,
                paid: cashGiven.toFixed(2),
                balance: balance.toFixed(2)
            };

            transactions.push(newTransaction);
            totalSales = totalSales + cartTotal;

            localStorage.setItem("transactions", JSON.stringify(transactions));
            localStorage.setItem("totalSales", totalSales);

            cart = [];
            cartTotal = 0;
            document.getElementById("cash-given").value = "";
            updateCartUI();
            updateUI();
        }

        function updateUI() {
            document.getElementById("total-sales").innerText = totalSales.toFixed(2);

            let tbody = document.getElementById("history-body");
            tbody.innerHTML = "";

            for (let i = transactions.length - 1; i >= 0; i--) {
                let tr = document.createElement("tr");

                let tdTime = document.createElement("td");
                tdTime.innerText = transactions[i].time;
                tr.appendChild(tdTime);

                let tdItems = document.createElement("td");
                tdItems.innerText = transactions[i].items;
                tr.appendChild(tdItems);

                let tdPaid = document.createElement("td");
                tdPaid.innerText = transactions[i].paid;
                tr.appendChild(tdPaid);

                let tdBalance = document.createElement("td");
                tdBalance.innerText = transactions[i].balance;
                tr.appendChild(tdBalance);

                tbody.appendChild(tr);
            }
        }

        function clearHistory() {
            if (confirm("Warning: This will delete all sales and history. Are you sure?")) {
                localStorage.clear();
                transactions = [];
                totalSales = 0;
                document.getElementById("balance-due").innerText = "0.00";
                updateUI();
            }
        }
    </script>
</body>
</html>
